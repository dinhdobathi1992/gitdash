<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repositories on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0D11}
a{color:#B9A6FF}a:hover{color:#D3C7FF}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(900px 480px at 78% -8%, rgba(124,92,255,0.13), transparent 70%), radial-gradient(700px 420px at 28% -12%, rgba(79,209,232,0.07), transparent 70%), #0B0D11; font-family: Geist, system-ui, sans-serif; color: #EDEAE3">

<header style="display: flex; align-items: center; gap: 4px; height: 56px; flex-shrink: 0; padding: 0 6px; margin-top: 44px">
<button type="button" aria-label="Switch organization" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #EDEAE3; font-family: inherit; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: #2A2350; color: #C9B8FF; font-size: 12px; font-weight: 600">AD</span>
<span style="font-size: 16px; font-weight: 600">ADI</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: #7A818D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<span style="flex-grow: 1"></span>
<button type="button" aria-label="Search" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3A9B4; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
</button>
<span style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin: 0 4px; border-radius: 18px; background: #173338; color: #7FE3F2; font-size: 12px; font-weight: 600">TD</span>
</header>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 8px 16px 96px">

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Repositories</h1>
<span style="font-size: 13px; color: #A3A9B4">93.4% success · 12,480 runs · last 30 days</span>
</div>

<section aria-labelledby="m-attn" style="display: flex; flex-direction: column; border-radius: 14px; border: 1px solid #1F2530; background: linear-gradient(180deg, #161B23 0%, #12161C 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 16px 36px -20px rgba(0,0,0,0.85)">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px">
<h2 id="m-attn" style="margin: 0; font-size: 14px; font-weight: 600; flex-grow: 1">Needs attention · 4</h2>
<a href="Alerts.dc.html" style="font-size: 13px; font-weight: 500; text-decoration: none">See all</a>
</div>
<a href="Workflow.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; text-decoration: none; color: #EDEAE3">
<span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: rgba(255,107,107,0.12); color: #FF8A8A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="m15 9-6 6M9 9l6 6"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 500">deploy-prod failing on main</span>
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #A3A9B4">tesda-backend · 18 min ago</span>
</span>
</a>
<a href="Repo.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px 12px; text-decoration: none; color: #EDEAE3; box-shadow: inset 0 1px 0 #1E242D">
<span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: rgba(245,181,68,0.12); color: #F5B544">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 500">build is 57% slower</span>
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #A3A9B4">n8n · 2 h ago</span>
</span>
</a>
</section>

<div role="group" aria-label="Filter" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #13171D; border: 1px solid #1E242D">
<button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 7px; background: #232A36; color: #EDEAE3; font-family: inherit; font-size: 14px; font-weight: 500">All 42</button>
<button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 7px; background: transparent; color: #A3A9B4; font-family: inherit; font-size: 14px; font-weight: 500">Failing 2</button>
<button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 7px; background: transparent; color: #A3A9B4; font-family: inherit; font-size: 14px; font-weight: 500">Pinned 3</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 14px; border: 1px solid #1F2530; background: linear-gradient(180deg, #161B23 0%, #12161C 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 16px 36px -20px rgba(0,0,0,0.85)">
<sc-for list="{{repos}}" as="r" hint-placeholder-count="5">
<a href="MobileRepo.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; text-decoration: none; color: #EDEAE3; box-shadow: {{r.line}}">
<span style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 500; flex-grow: 1">{{r.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 500; background: {{r.sBg}}; color: {{r.sFg}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: {{r.sFg}}"></span>{{r.status}}</span>
</span>
<span style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; gap: 3px">
<sc-for list="{{r.runs}}" as="d" hint-placeholder-count="10"><span style="width: 8px; height: 16px; border-radius: 2px; background: {{d.c}}"></span></sc-for>
</span>
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 13px">{{r.succ}}</span>
<span style="flex-grow: 1; text-align: right; font-size: 12px; color: #7A818D">{{r.last}}</span>
</span>
</a>
</sc-for>
</div>

</div>

<nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 84px; padding: 6px 8px 28px; box-sizing: border-box; background: #0F1217; box-shadow: inset 0 1px 0 #1E242D">
<a href="Mobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #EDEAE3; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: #A48BFF; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
Repos
</a>
<a href="Alerts.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #A3A9B4; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
Alerts
<span aria-label="3 firing" style="position: absolute; top: 2px; left: 52%; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #FF6B6B; color: #1A0B0B; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center">3</span>
</a>
<a href="Team.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #A3A9B4; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
Team
</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #A3A9B4; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
More
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const RUN = { P: '#3DD68C', F: '#FF6B6B', C: '#4B525E', R: '#4FD1E8' };
    const ST = {
      Failing: { fg: '#FF8A8A', bg: 'rgba(255,107,107,0.12)' },
      Passing: { fg: '#5BE0A0', bg: 'rgba(61,214,140,0.12)' },
      Running: { fg: '#6FDBEE', bg: 'rgba(79,209,232,0.12)' }
    };
    const repos = [
      ['tesda-backend', 'Failing', '71%', 'PPPFPPPFFF', '18 min ago'],
      ['tf-adi-infra-aws', 'Failing', '64%', 'PFPPFPPFPF', '6 h ago'],
      ['tesda-frontend', 'Running', '96%', 'PPPPPPPPPR', 'now'],
      ['n8n', 'Passing', '92%', 'PPFPPPPPPP', '1 h ago'],
      ['adi-k8s-helm', 'Passing', '98%', 'PPPPPPPPPP', '3 h ago']
    ].map(([name, status, succ, runs, last], i) => ({
      name, status, succ, last,
      sFg: ST[status].fg, sBg: ST[status].bg,
      runs: runs.split('').map((c) => ({ c: RUN[c] })),
      line: i === 0 ? 'none' : 'inset 0 1px 0 #1E242D'
    }));
    return { repos };
  }
}
</script>
</body>
</html>
